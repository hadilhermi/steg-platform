name: Docker security and publish

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-scan-publish:
    name: Build, scan, and publish ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: frontend
            context: ./frontend
          - image: backend
            context: ./backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image for scanning
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          load: true
          push: false
          tags: steg-platform-${{ matrix.image }}:ci
      - name: Scan image for critical and high vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: steg-platform-${{ matrix.image }}:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish image to GHCR
        if: github.event_name == 'push'
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/steg-platform-${{ matrix.image }}
          SHA: ${{ github.sha }}
        run: |
          docker tag steg-platform-${{ matrix.image }}:ci "$IMAGE:latest"
          docker tag steg-platform-${{ matrix.image }}:ci "$IMAGE:$SHA"
          docker push "$IMAGE:latest"
          docker push "$IMAGE:$SHA"
