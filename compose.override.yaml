services:
  mongo-backup:
    image: mongo:8
    profiles: [backup]
    restart: "no"
    entrypoint: ["/bin/sh", "/scripts/backup-mongo.sh"]
    environment:
      MONGODB_URI: mongodb://mongo:27017/steg_platform
      BACKUP_DIR: /backups
    volumes:
      - ./scripts/backup-mongo.sh:/scripts/backup-mongo.sh:ro
      - mongo-backups:/backups
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - steg-internal

volumes:
  mongo-backups:
